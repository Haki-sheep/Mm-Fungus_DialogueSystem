<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>苔间 · 剧情工作台</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101318;
        --panel: #171c24;
        --card: #202733;
        --line: #344050;
        --text: #e8edf5;
        --muted: #a3adbd;
        --mint: #8ab4ff;
        --blue: #9ec7ff;
        --gold: #edc078;
        --danger: #ff9b9b;
        --button: #242d3a;
        --hover: #303d50;
        --field: #111720;
        --selected: #243a5a;
        --accent-text: #101e34;
        --grid: #313a48;
        --wire: #8295af;
        --node-border: #495970;
        --help: #1c2a40;
        --backdrop: #080d18bb;
        --toast: #dce8ff;
        --toast-text: #123568;
        --tone-say: #8ccfae;
        --tone-choice: #edc078;
        --tone-condition: #bcadf5;
        --tone-set: #d9d17d;
        --tone-wait: #8cbde4;
        --tone-event: #efa8bc;
        --tone-sound: #9fc9ee;
        --tone-end: #abb6c6;
        font:
          14px/1.6 "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f0f3f8;
        --panel: #ffffff;
        --card: #ffffff;
        --line: #d3dce8;
        --text: #1e293b;
        --muted: #5b6a80;
        --mint: #245fc9;
        --blue: #2464b6;
        --gold: #925c10;
        --danger: #b62f42;
        --button: #edf2f9;
        --hover: #dfe9f8;
        --field: #f8fafd;
        --selected: #e7efff;
        --accent-text: #ffffff;
        --grid: #cbd5e4;
        --wire: #8a9db7;
        --node-border: #bac8db;
        --help: #edf3fd;
        --backdrop: #1b2e4c55;
        --toast: #163b75;
        --toast-text: #ffffff;
        --tone-say: #22664b;
        --tone-choice: #84540c;
        --tone-condition: #7150b5;
        --tone-set: #6c650d;
        --tone-wait: #216894;
        --tone-event: #a43f64;
        --tone-sound: #216894;
        --tone-end: #56657a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--button);
        padding: 7px 12px;
        white-space: nowrap;
      }
      button:hover {
        background: var(--hover);
        border-color: var(--mint);
      }
      button:focus-visible,
      input:focus,
      textarea:focus,
      select:focus {
        outline: 2px solid var(--mint);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button.primary {
        background: var(--mint);
        color: var(--accent-text);
        border-color: var(--mint);
        font-weight: 650;
      }
      button.ghost {
        background: transparent;
      }
      button.danger {
        color: var(--danger);
      }
      input,
      textarea,
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--field);
        padding: 8px 10px;
      }
      input[type="checkbox"] {
        width: auto;
        accent-color: var(--mint);
      }
      textarea {
        resize: vertical;
        min-height: 100px;
      }
      label {
        display: block;
        margin: 14px 0 5px;
        color: var(--text);
        font-size: 12px;
      }
      small,
      .hint {
        font-size: 12px;
        color: var(--muted);
      }
      .hint {
        margin: 7px 0 12px;
        line-height: 1.8;
      }
      .muted {
        color: var(--muted);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .row > * {
        min-width: 0;
      }
      .grow {
        flex: 1;
      }
      .badge {
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 3px 9px;
        font-size: 11px;
        color: var(--muted);
      }
      .badge.live {
        color: var(--mint);
        border-color: var(--line);
      }
      .divider {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 18px 0;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h2 {
        font-size: 21px;
      }
      h3 {
        font-size: 14px;
        margin-bottom: 8px;
      }
      header {
        height: 76px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        padding: 0 22px;
        gap: 16px;
        background: var(--panel);
      }
      .brandmark {
        color: var(--mint);
        font-size: 28px;
      }
      .brand {
        letter-spacing: 3px;
        font-weight: 600;
        font-size: 18px;
      }
      .subbrand {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 2px;
      }
      .toolbar {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .shell {
        display: grid;
        grid-template-columns:
          var(--left-width, 218px) 8px minmax(280px, 1fr)
          8px var(--right-width, 310px);
        min-width: 716px;
        height: calc(100vh - 110px);
      }
      .panel-divider {
        cursor: col-resize;
        touch-action: none;
        background: var(--panel);
        position: relative;
      }
      .panel-divider::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 3px;
        width: 2px;
        background: var(--line);
      }
      .panel-divider:hover::after,
      .panel-divider:focus-visible::after,
      .panel-divider.dragging::after {
        background: var(--mint);
      }
      body.resizing {
        cursor: col-resize;
        user-select: none;
      }
      body.resizing .canvasbar {
        pointer-events: none;
      }
      aside {
        overflow: auto;
        background: var(--panel);
        padding: 18px;
      }
      .left {
        border-right: 1px solid var(--line);
      }
      .inspector {
        border-left: 1px solid var(--line);
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 2px;
        color: var(--mint);
        margin-bottom: 8px;
      }
      .story-heading {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .story-heading button {
        flex: 0 0 auto;
        padding: 4px 8px;
      }
      .title-input {
        min-width: 0;
        flex: 1;
        font-size: 17px;
        font-weight: 600;
        border: none;
        background: transparent;
        padding: 0;
      }
      .title-input[readonly] {
        cursor: text;
      }
      .title-input:not([readonly]) {
        background: var(--panel);
        outline: 2px solid var(--mint);
      }
      .add-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
        margin: 10px 0;
      }
      .add-grid button {
        padding: 8px 4px;
        text-align: left;
        font-size: 12px;
      }
      .node-icon {
        margin-right: 6px;
        color: var(--mint);
      }
      .outline-item {
        display: flex;
        gap: 9px;
        align-items: center;
        border-radius: 6px;
        padding: 8px 6px;
        cursor: pointer;
        font-size: 12px;
        color: var(--muted);
        margin: 2px 0;
      }
      .outline-item.selected {
        background: var(--selected);
        color: var(--mint);
      }
      .outline-item span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .outline-item {
        gap: 6px;
        min-height: 32px;
      }
      .outline-item:focus-visible {
        outline: 1px solid var(--mint);
      }
      .outline-fold {
        flex: 0 0 30px;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 0;
        background: transparent;
        font-size: 23px;
        color: var(--text);
      }
      .outline-label {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .outline-copy {
        flex: 1;
        min-width: 0;
      }
      .count {
        font-size: 11px;
        color: var(--muted);
      }
      .workspace {
        position: relative;
        overflow: hidden;
        background: var(--bg);
      }
      .canvasbar {
        position: absolute;
        z-index: 3;
        top: 16px;
        left: 18px;
        right: 18px;
        display: flex;
        gap: 7px;
        align-items: center;
        pointer-events: none;
        flex-wrap: wrap;
      }
      .canvasbar > * {
        pointer-events: auto;
      }
      .canvasbar .badge {
        background: var(--panel);
      }
      .canvas-scroll {
        width: 100%;
        height: 100%;
        overflow: auto;
        background-image: radial-gradient(var(--grid) 1px, transparent 1px);
        background-size: 22px 22px;
      }
      .stage-space {
        width: 3200px;
        height: 2400px;
      }
      .stage {
        width: 3200px;
        height: 2400px;
        position: relative;
        transform-origin: 0 0;
      }
      svg.wires {
        position: absolute;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      .wire {
        fill: none;
        stroke: var(--wire);
        stroke-width: 2;
        opacity: 0.75;
      }
      .wire.active {
        stroke: var(--mint);
        stroke-width: 3;
      }
      .wire.selected,
      .wire-group:focus-visible .wire {
        stroke: var(--gold);
        stroke-width: 4;
        opacity: 1;
      }
      .wire-group {
        outline: none;
      }
      .wire-hit {
        fill: none;
        stroke: transparent;
        stroke-width: 18;
        pointer-events: stroke;
        cursor: pointer;
      }
      .wire {
        pointer-events: none;
      }
      .wire-preview {
        fill: none;
        stroke: var(--mint);
        stroke-width: 3;
        stroke-dasharray: 7 5;
        pointer-events: none;
      }
      .stage {
        touch-action: none;
      }
      .port.drop-ready {
        background: var(--mint);
        box-shadow: 0 0 0 5px var(--selected);
      }
      .node {
        position: absolute;
        width: 218px;
        background: var(--card);
        border: 1px solid var(--node-border);
        border-radius: 10px;
        box-shadow: 0 8px 30px #0003;
        cursor: grab;
        user-select: none;
      }
      .node.selected {
        border-color: var(--mint);
        box-shadow:
          0 0 0 1px var(--mint),
          0 10px 35px #0005;
      }
      .node-top {
        padding: 9px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 10px;
        color: var(--node-color, var(--mint));
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .node-body {
        padding: 10px 14px 12px;
      }
      .node-title {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 5px;
      }
      .node-preview {
        font-size: 11px;
        color: var(--muted);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 19px;
      }
      .port {
        width: 12px;
        height: 12px;
        border: 2px solid var(--node-color, var(--mint));
        background: var(--card);
        border-radius: 50%;
        padding: 0;
        position: absolute;
        z-index: 2;
        cursor: crosshair;
      }
      .port.in {
        left: -7px;
        top: 21px;
      }
      .outputs {
        padding: 0 14px 8px;
      }
      .output {
        height: 24px;
        position: relative;
        font-size: 10px;
        color: var(--muted);
        text-align: right;
        padding-right: 3px;
      }
      .output .port {
        right: -21px;
        top: 5px;
      }
      .port.linking {
        background: var(--mint);
        box-shadow: 0 0 12px var(--mint);
      }
      .canvas-note {
        position: absolute;
        bottom: 20px;
        left: 20px;
        right: 20px;
        color: var(--muted);
        font-size: 11px;
        pointer-events: none;
      }
      .canvas-note span {
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 7px 13px;
        border-radius: 20px;
      }
      footer {
        height: 34px;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 20px;
        align-items: center;
        padding: 0 18px;
        font-size: 11px;
        color: var(--muted);
        background: var(--panel);
      }
      #status {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #sync-state {
        margin-left: auto;
        color: var(--mint);
        white-space: nowrap;
      }
      .field-group {
        padding: 0 0 12px;
      }
      .help-card {
        border: 1px solid var(--line);
        background: var(--help);
        padding: 12px;
        border-radius: 8px;
        font-size: 12px;
        color: var(--text);
        line-height: 1.9;
      }
      .section-title {
        font-size: 12px;
        letter-spacing: 1px;
        margin: 22px 0 10px;
        color: var(--muted);
      }
      .option-editor {
        padding: 10px;
        background: var(--field);
        border-radius: 7px;
        margin-top: 10px;
      }
      .option-editor label {
        margin-top: 6px;
      }
      .entry-tag {
        color: var(--gold);
        font-size: 10px;
      }
      .empty {
        color: var(--muted);
        padding: 25px 0;
      }
      .danger-text {
        color: var(--danger);
      }
      dialog {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 26px;
        width: min(820px, 92vw);
        max-height: 88vh;
        overflow: auto;
        box-shadow: 0 25px 100px #0007;
      }
      dialog::backdrop {
        background: var(--backdrop);
        backdrop-filter: blur(5px);
      }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .modal-head h2 {
        margin: 0;
      }
      .modal-footer {
        display: flex;
        align-items: center;
        gap: 9px;
        justify-content: flex-end;
        margin-top: 18px;
      }
      .code {
        font:
          12px/1.6 Consolas,
          monospace;
        min-height: 290px;
        white-space: pre;
      }
      .variable-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 95px 1fr 36px;
        gap: 7px;
        margin: 10px 0;
      }
      .variable-grid input,
      .variable-grid select {
        padding: 7px;
        font-size: 12px;
      }
      .preview-stage {
        background:
          radial-gradient(ellipse at 25% 0%, var(--selected), transparent 70%),
          var(--field);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 30px;
        min-height: 240px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      .preview-actor {
        color: var(--mint);
        font-size: 13px;
        margin-bottom: 8px;
      }
      .preview-text {
        font-size: 19px;
        white-space: pre-wrap;
        line-height: 1.8;
      }
      .preview-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 22px;
      }
      .preview-vars {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 15px 0;
      }
      .preview-log {
        font-size: 12px;
        max-height: 130px;
        overflow: auto;
        color: var(--muted);
        white-space: pre-wrap;
      }
      .catalog-card {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-top: 10px;
      }
      .catalog-card h3 {
        color: var(--mint);
      }
      #toast {
        position: fixed;
        bottom: 52px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        background: var(--toast);
        color: var(--toast-text);
        padding: 11px 22px;
        border-radius: 9px;
        max-width: 80vw;
        box-shadow: 0 8px 40px #0008;
        display: none;
      }
      #toast.error {
        background: #f3c2bd;
        color: #4b221e;
      }
      .mobile-note {
        display: none;
      }
      .preview-label {
        font-size: 10px;
        color: var(--gold);
        letter-spacing: 1px;
        margin-bottom: 15px;
      }
      #issues {
        padding: 12px;
        background: var(--field);
        border-radius: 7px;
        white-space: pre-wrap;
        font-size: 12px;
        max-height: 220px;
        overflow: auto;
      }
      .check-ok {
        color: var(--mint);
      }
      .check-bad {
        color: var(--danger);
      }
      @media (max-width: 1080px) {
        .toolbar {
          gap: 4px;
        }
        .toolbar button {
          padding: 6px 8px;
          font-size: 12px;
        }
        header {
          padding: 0 12px;
          gap: 9px;
        }
        .subbrand {
          display: none;
        }
        .brand {
          font-size: 15px;
        }
        aside {
          padding: 13px;
        }
        .badge {
          font-size: 10px;
        }
      }
      @media (max-width: 760px) {
        .shell {
          overflow: auto;
        }
        .toolbar button.secondary {
          display: none;
        }
        header .brandmark {
          display: none;
        }
        header {
          min-width: 716px;
        }
        footer {
          min-width: 716px;
        }
        .shell {
          min-width: 716px;
        }
      }
      .story-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 9px;
      }
      .story-actions button {
        padding: 8px 6px;
      }
      .story-picker {
        position: relative;
      }
      .story-picker-field {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--field);
      }
      .story-picker-field:focus-within {
        outline: 2px solid var(--mint);
      }
      #story-choice-name {
        flex: 1;
        min-width: 0;
        border: 0;
        background: transparent;
        font-size: 12px;
      }
      #story-picker-toggle {
        padding: 6px 10px;
        border: 0;
        background: transparent;
      }
      #story-picker-list {
        position: absolute;
        z-index: 30;
        top: calc(100% + 5px);
        left: 0;
        right: 0;
        max-height: 340px;
        overflow-y: auto;
        padding: 6px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 7px;
        box-shadow: 0 10px 24px #0005;
      }
      .story-picker-group {
        padding: 7px 5px 3px;
        color: var(--muted);
        font-size: 11px;
      }
      .story-picker-option {
        display: block;
        width: 100%;
        border: 0;
        border-radius: 4px;
        background: transparent;
        padding: 8px;
        text-align: left;
        overflow-wrap: anywhere;
      }
      .story-picker-option[aria-selected="true"] {
        background: var(--selected);
      }
      #modal.preview-modal {
        width: min(1080px, 94vw);
      }
      .preview-toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .preview-toolbar select {
        width: auto;
      }
      .preview-toolbar label {
        margin: 0;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .preview-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 230px;
        gap: 16px;
      }
      .preview-data {
        padding: 14px;
        background: var(--field);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .preview-data label {
        margin-top: 8px;
      }
      .preview-data .preview-log {
        max-height: 210px;
      }
      .preview-stage {
        min-height: 350px;
        justify-content: center;
      }
      .preview-title {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 24px;
      }
      .preview-text:focus {
        outline: none;
      }
      .preview-variable {
        margin-bottom: 8px;
      }
      .preview-variable input,
      .preview-variable select {
        padding: 5px 8px;
      }
      .preview-variable label {
        font-size: 11px;
      }
      .preview-log {
        max-height: 210px;
      }
      @media (max-width: 800px) {
        .preview-layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brandmark">✳</div>
      <div>
        <div class="brand">苔间 <span class="muted">/</span> 剧情工作台</div>
        <div class="subbrand">AMANITA STORY WORKSPACE</div>
      </div>
      <span class="badge" id="connection">离线草稿</span>
      <div class="toolbar">
        <button class="ghost" id="theme-toggle" aria-label="切换黑夜白天配色">
          白天模式</button
        ><button class="ghost secondary" id="ai">AI 辅助</button
        ><button class="ghost" id="file-import">导入 JSON</button

    <script>
      "use strict";
      const $ = (id) => document.getElementById(id),
        esc = (value) =>
          String(value ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
      const kinds = {
        say: {
          title: "对白",
          icon: "▤",
          color: "var(--tone-say)",

        choice: {
          title: "玩家选择",
          icon: "⑂",
          color: "var(--tone-choice)",
          help: "为玩家提供选项，每个选项连接一条后续剧情。",
        },
        condition: {
          title: "条件分支",
          icon: "◇",

        set: {

        },
        sound: {

          icon: "♫",

          icon: "■",

      };
      const typeTitles = {
        Integer: "整数",
        Float: "小数",
        Boolean: "开关",
        String: "文字",
        None: "无需参数",
      };
      const demo = {
        version: 1,
        id: "new_story",
        title: "新的剧情",
        entry: "arrival",
        variables: [],
        nodes: [
          { id: "arrival", title: "开始剧情", type: "say", x: 90, y: 130, actor: "", text: "在这里填写对白。", next: "finish" },
          { id: "finish", title: "剧情结束", type: "end", x: 430, y: 130 }
        ]
      };
      const offlineCatalog = { maxOptions: 6, actors: [], audio: [], stories: [] };
      const draftSlot =
        new URLSearchParams(location.hash.slice(1)).get("draft") || "";
      const draftKey =
          "amanita.webstory.draft.v1" + (draftSlot ? "." + draftSlot : ""),
        clone = (value) => JSON.parse(JSON.stringify(value));
      let catalog = clone(offlineCatalog),
        doc = clone(demo),
        revision = "",
        selected = "arrival",
        zoom = 1,
        connected = false,
        linking = null,
        drag = null,
        resizeState = null,
        selectedWire = null,
        graphSelectionActive = false,
        outlineRows = [],
        history = [],
        future = [],
        historyTimer = 0,
        toastTimer = 0,
        simulation = null,
        dirty = true,
        writing = false;
      const knownRevisions = new Map();
      const revisionKey = (id, slot = storyLibrary.active) => slot + ":" + id;
      const libraryKey =
        "amanita.webstory.library.v1" + (draftSlot ? "." + draftSlot : "");
      let storyLibrary = { active: "", items: [] };
      const layoutKey = "amanita.webstory.layout.v1";
      const panelLimits = {
        left: { min: 180, max: 500, initial: 218 },
        right: { min: 240, max: 560, initial: 310 },
      };
      let uiPreferences = { leftWidth: 218, rightWidth: 310, collapsed: {} };
      const defaultCanvasTip =
        "拖圆点连线 · Ctrl+C / V / X 复制、粘贴、剪切卡片 · Del 删除卡片或断开连线";

      const params = new URLSearchParams(location.hash.slice(1)),
        token = params.get("token") || "";
      function message(text, error = false) {
        $("toast").textContent = text;
        $("toast").className = error ? "error" : "";
        $("toast").style.display = "block";
        clearTimeout(toastTimer);
        toastTimer = setTimeout(
          () => ($("toast").style.display = "none"),
          6500,
        );
        $("status").textContent = text;
      }
      function snapshot() {
        return JSON.stringify({ doc, revision, selected, dirty });
      }
      function saveDraft() {
        if (!storyLibrary.active) storyLibrary.active = crypto.randomUUID();
        const state = JSON.parse(snapshot());
        const index = storyLibrary.items.findIndex(
          (item) => item.slot === storyLibrary.active,
        );
        const item = { slot: storyLibrary.active, ...state };
        if (index < 0) storyLibrary.items.push(item);
        else storyLibrary.items[index] = item;
        localStorage.setItem(libraryKey, JSON.stringify(storyLibrary));
        localStorage.setItem(draftKey, snapshot());
        refreshStoryOptions();
      }
      function activateStory(
        state,
        slot = crypto.randomUUID(),
        preserveCurrent = true,
      ) {
        finishGestures();
        finishStoryRename(false);
        finishPickerRename(false);
        closeStoryPicker();
        if (preserveCurrent) saveDraft();
        storyLibrary.active = slot;
        doc = clone(state.doc);
        revision = state.revision || "";
        if (revision) knownRevisions.set(revisionKey(doc.id), revision);
        selected = state.selected || doc.entry;
        dirty = state.dirty !== false;
        history = [];
        future = [];
        clearTimeout(historyTimer);
        historyTimer = 0;
        graphSelectionActive = false;
        saveDraft();
        render();
        refreshHistory();
        $("sync-state").textContent = dirty
          ? "草稿已自动保存 · 待回填"
          : "与 Unity 回填版本一致";
        $("modal").close();
        selectNode(selected, true, false);
        $("unity-stories").value = "draft:" + storyLibrary.active;
        refreshStoryPicker();
        $("stage").focus({ preventScroll: true });
      }
      function refreshStoryOptions() {
        const select = $("unity-stories");
        const previous = select.value;
        const groups = [
          {
            label: "本地剧情",
            options: storyLibrary.items.map((item) => ({
              value: "draft:" + item.slot,
              label: `${item.doc.title} · 本地${item.slot === storyLibrary.active ? " · 当前" : ""}`,
            })),
          },
          {
            label: "Unity 已回填",
            options: catalog.stories.map((item) => ({
              value: "unity:" + item.id,
              label: item.title + " · Unity",
            })),
          },
          {
            label: "本地回收站 · 读取可恢复",
            options: (storyLibrary.trash || []).map((item) => ({
              value: "trash:" + item.slot,
              label: item.doc.title + " · 可恢复",
            })),
          },
        ].filter((group) => group.options.length);
        const currentGroups = [...select.children];
        const sameStructure =
          currentGroups.length === groups.length &&
          groups.every((group, index) => {
            const current = currentGroups[index];
            return (
              current.label === group.label &&
              current.children.length === group.options.length &&
              group.options.every(
                (option, optionIndex) =>
                  current.children[optionIndex].value === option.value,
              )
            );
          });
        if (!sameStructure) {
          select.replaceChildren(
            ...groups.map((group) => {
              const element = document.createElement("optgroup");
              element.label = group.label;
              for (const option of group.options) {
                const entry = document.createElement("option");
                entry.value = option.value;
                entry.textContent = option.label;
                element.append(entry);
              }
              return element;
            }),
          );
        } else {
          groups
            .flatMap((group) => group.options)
            .forEach((option, index) => {
              const entry = select.options[index];
              if (entry.textContent !== option.label)
                entry.textContent = option.label;
            });
        }
        const next = [...select.options].some(
          (option) => option.value === previous,
        )
          ? previous
          : "draft:" + storyLibrary.active;
        if (select.value !== next) select.value = next;
        refreshStoryPicker();
      }
      function refreshStoryPicker() {
        const select = $("unity-stories");
        if ($("story-choice-name").readOnly)
          $("story-choice-name").value =
            select.selectedOptions[0]?.textContent || "";
        if ($("story-picker-list").hidden) return;
        $("story-picker-list").innerHTML = [...select.children]
          .map(
            (group) =>
              `<div role="group" aria-label="${esc(group.label)}"><div class="story-picker-group">${esc(group.label)}</div>${[...group.children].map((option) => `<button class="story-picker-option" role="option" aria-selected="${option.value === select.value}" data-story="${esc(option.value)}">${esc(option.textContent)}</button>`).join("")}</div>`,
          )
          .join("");
      }
      function closeStoryPicker() {
        $("story-picker-list").hidden = true;
        $("story-picker-toggle").setAttribute("aria-expanded", "false");
      }
      async function loadUnityStory(id) {
        const result = await api("story?id=" + encodeURIComponent(id));
        const existing =
          storyLibrary.items.find(
            (item) => item.doc.id === id && item.slot === storyLibrary.active,
          ) || storyLibrary.items.find((item) => item.doc.id === id);
        const apply = async () => {
          activateStory(
            {
              doc: result.document,
              revision: result.revision,
              selected: result.document.entry,
              dirty: false,
            },
            existing?.slot,
          );
          await refreshCatalog(false);
          message("已读取 Unity 保存的剧情源数据");
        };
        if (existing?.dirty) {
          showModal(
            "读取 Unity 剧情",
            `<div class="help-card">${esc(result.document.title)} · ${esc(id)}<br>将用 Unity 保存的版本替换同名本地草稿，共 ${result.document.nodes.length} 张卡片。当前本地未回填的修改会被替换。</div><div class="modal-footer"><button id="confirm-read" class="primary">读取并替换本地版本</button></div>`,
          );
          $("confirm-read").onclick = run(apply);
        } else await apply();
      }
      function copyStory() {
        const copy = clone(doc);
        copy.id = "story_" + crypto.randomUUID().replaceAll("-", "");
        copy.title += " 副本";
        activateStory({ doc: copy, selected: copy.entry, dirty: true });
        message("已复制整套剧情并切换到新的剧情段");
      }
      $("copy-story").onclick = copyStory;
      $("delete-story").onclick = run(async () => {
        if (writing) throw new Error("请等待正在进行的 Unity 回填完成");
        saveDraft();
        const choice = $("unity-stories").value;
        if (choice.startsWith("trash:"))
          throw new Error("此剧情已经在本地回收站中，可点击读取恢复");
        if (choice.startsWith("draft:")) {
          const slot = choice.slice(6);
          const item = clone(
            storyLibrary.items.find((item) => item.slot === slot),
          );
          showModal(
            "删除本地剧情",
            `<div class="help-card">${esc(item.doc.title)} · ${esc(item.doc.id)}<br>共 ${item.doc.nodes.length} 张卡片，将移入本地回收站，保留 Unity 已回填版本。需要恢复时在剧情下拉框的回收站中选择它，再点击读取。</div><div class="modal-footer"><button class="danger" id="confirm-delete-story">删除这段本地剧情</button></div>`,
          );
          $("confirm-delete-story").onclick = () => {
            storyLibrary.trash ||= [];
            storyLibrary.trash.push(item);
            storyLibrary.items = storyLibrary.items.filter(
              (entry) => entry.slot !== slot,
            );
            if (slot === storyLibrary.active) {
              const next = storyLibrary.items[0];
              activateStory(
                next || { doc: emptyStory(), dirty: true },
                next?.slot,
                false,
              );
            } else {
              saveDraft();
              $("modal").close();
            }
            message("本地剧情已移入回收站，可选择后读取恢复");
          };
        } else if (choice.startsWith("unity:")) {
          const id = choice.slice(6);
          const item = catalog.stories.find((item) => item.id === id);
          showModal(
            "删除 Unity 剧情",
            `<div class="help-card">${esc(item.title)} · ${esc(id)}<br>将把生成的剧情 SO 移入 Unity 项目的 AmanitaWebStory/Trash 回收目录，保留本地草稿和资源 GUID。可在 Unity Project 中移回 Generated 恢复。</div><div class="modal-footer"><button class="danger" id="confirm-delete-story">删除这段 Unity 剧情</button></div>`,
          );
          $("confirm-delete-story").onclick = run(async () => {
            writing = true;
            $("push").disabled = true;
            try {
              const result = await api("delete", {
                id,
                revision: item.revision,
              });
              for (const draft of [
                ...storyLibrary.items,
                ...(storyLibrary.trash || []),
              ].filter((entry) => entry.doc.id === id)) {
                draft.revision = "";
                draft.dirty = true;
                knownRevisions.set(revisionKey(id, draft.slot), "");
              }
              if (doc.id === id) {
                revision = "";
                dirty = true;
              }
              saveDraft();
              await refreshCatalog(false);
              showModal(
                "Unity 剧情已删除",
                `<div class="help-card">已移入：${esc(result.trashPath)}</div><p class="hint">本地草稿仍可编辑；重新回填会生成新的 Unity 资产。恢复旧资产时，将回收目录里的剧情 SO 移回 Generated，再读取 Unity 版本。</p>`,
              );
            } finally {
              writing = false;
              $("push").disabled = false;
            }
          });
        }
      });
      function applyTheme() {
        const theme = uiPreferences.theme === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        $("theme-toggle").textContent =
          theme === "dark" ? "☀ 白天模式" : "☾ 黑夜模式";
      }
      $("theme-toggle").onclick = () => {
        uiPreferences.theme =
          uiPreferences.theme === "light" ? "dark" : "light";
        applyTheme();
        saveUiPreferences();
      };
      function checkpoint() {
        clearTimeout(historyTimer);
        historyTimer = 0;
        const value = snapshot();
        if (history.at(-1) !== value) history.push(value);
        if (history.length > 80) history.shift();
        future = [];
        refreshHistory();
      }
      function changed() {
        dirty = true;
        $("sync-state").textContent = "草稿已自动保存 · 待回填";
        saveDraft();
        refreshHeader();
      }
      function delayedCheckpoint() {
        if (!historyTimer) {
          checkpoint();
          historyTimer = setTimeout(() => {
            historyTimer = 0;
          }, 600);
        }
      }
      function refreshHistory() {
        $("undo").disabled = history.length === 0;
        $("redo").disabled = future.length === 0;
      }
      function restore(value) {
        const state = JSON.parse(value);
        doc = state.doc;
        revision =
          knownRevisions.get(revisionKey(doc.id)) ?? state.revision ?? "";
        selected = state.selected;
        dirty = true;
        render();
        saveDraft();
        $("sync-state").textContent = dirty
          ? "草稿已自动保存 · 待回填"
          : "与 Unity 回填版本一致";
      }
      function undo() {
        if (!history.length) return;
        future.push(snapshot());
        restore(history.pop());
        refreshHistory();
      }
      function redo() {
        if (!future.length) return;
        history.push(snapshot());
        restore(future.pop());
        refreshHistory();
      }
      async function api(path, body) {
        if (!token)
          throw new Error(
            "从 Unity 菜单 Tools / Fungus / 打开网页剧情编辑器 打开，才能一键回填",
          );
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 30000);
        try {
          const response = await fetch("/api/" + path, {
            method: body === undefined ? "GET" : "POST",
            headers: {
              Authorization: "Bearer " + token,
              "Content-Type": "application/json",
            },
            body: body === undefined ? undefined : JSON.stringify(body),
            signal: controller.signal,
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "请求失败");
          return data;
        } catch (error) {
          if (error.name === "AbortError")
            throw new Error(
              "Unity 请求超时，请检查编辑器状态。回填结果可能已写入，请先读取 Unity 版本确认后再提交。",
            );
          throw error;
        } finally {
          clearTimeout(timer);
        }
      }
      function run(action) {
        return async () => {
          try {
            await action();
          } catch (error) {
            message(error.message, true);
          }
        };
      }
      function showModal(title, html) {
        stopPreview();
        finishGestures();
        $("modal-title").textContent = title;
        $("modal-body").innerHTML = html;
        bindLabels($("modal-body"), "dialog-field");
        if (!$("modal").open) $("modal").showModal();
      }
      function bindLabels(root, prefix) {
        root.querySelectorAll("label").forEach((label, index) => {
          const input = label.nextElementSibling;
          if (
            !input ||
            !["INPUT", "SELECT", "TEXTAREA"].includes(input.tagName)
          )
            return;
          if (!input.id) input.id = prefix + "-" + index;
          label.htmlFor = input.id;
        });
      }
      function refreshHeader() {
        $("graph-title").textContent = doc.title;
        $("node-count").textContent = doc.nodes.length + " 张";
        if ($("story-title").readOnly) $("story-title").value = doc.title;
      }
      function ports(node) {
        if (node.type === "end") return [];
        if (node.type === "choice")
          return (node.options || []).map((o, i) => ({
            field: "option:" + i,
            label: o.text || "选项 " + (i + 1),
            target: o.target,
          }));
        if (node.type === "condition")
          return [
            { field: "onTrue", label: "满足条件", target: node.onTrue },
            { field: "onFalse", label: "不满足", target: node.onFalse },
          ];

        $("apply-ai").onclick = run(() => applyDocument(parsed));
      };
      const previewHistoryLimit = 200;
      const previewStepBudget = 200;
      function stopPreview() {
        if (simulation) clearTimeout(simulation.timer);
        simulation = null;
        $("modal").classList.remove("preview-modal");
      }
      function cancelPreviewTimer() {
        clearTimeout(simulation.timer);
        simulation.timer = null;
        simulation.generation++;
      }
      function schedulePreview(action, milliseconds) {
        const state = simulation,
          generation = state.generation;
        state.timer = setTimeout(() => {
          if (
            simulation !== state ||
            state.generation !== generation ||
            !$("modal").open
          )
            return;
          state.timer = null;
          action();
        }, milliseconds);
      }
      function startPreview() {
        const result = checkDocument(doc);
        if (result.errors.length)
          return message("试读前请修复：" + result.errors[0], true);
        showModal(
          "试读 · " + doc.title,
          `<div class="preview-label">模拟剧情与变量 · 事件和音效仅记录轨迹，实际表现请在 Unity 验收</div><div class="preview-toolbar"><button id="preview-back">← 上一步</button><button id="restart-preview">从头开始</button><button id="preview-auto">▶ 自动播放</button><select id="preview-speed" aria-label="试读文字速度"><option value="20">慢速文字</option><option value="40" selected>标准文字</option><option value="80">快速文字</option><option value="0">立即显示</option></select><label><input type="checkbox" id="preview-real-wait" checked>按实际时间等待</label></div><div class="preview-layout"><div class="preview-stage"><div class="preview-title" id="preview-progress"></div><div class="preview-actor" id="preview-actor"></div><div class="preview-text" id="preview-text" tabindex="0"></div><div class="preview-actions" id="preview-actions"></div></div><div class="preview-data"><h3>本轮变量</h3><p class="hint">可临时调整以测试分支，不改动剧情初始配置。</p><div id="preview-vars"></div><h3>执行轨迹</h3><div class="preview-log" id="preview-log"></div></div></div>`,
        );
        $("modal").classList.add("preview-modal");
        simulation = {
          document: clone(doc),
          node: doc.entry,
          values: Object.fromEntries(
            doc.variables.map((variable) => [
              variable.key,
              parseValue(variable.type, variable.value),
            ]),
          ),
          log: [],
          history: [],
          view: null,
          next: null,
          ended: false,
          auto: false,
          speed: 40,
          realWait: true,
          timer: null,
          generation: 0,
          sequence: 0,
          chain: [],
          typing: false,
        };
        $("restart-preview").onclick = startPreview;
        $("preview-back").onclick = () => {
          if (!simulation.history.length) return;
          cancelPreviewTimer();
          Object.assign(simulation, simulation.history.pop());
          simulation.auto = false;
          renderPreview();
        };
        $("preview-auto").onclick = () => {
          simulation.auto = !simulation.auto;
          $("preview-auto").textContent = simulation.auto
            ? "Ⅱ 暂停自动"
            : "▶ 自动播放";
          if (!simulation.typing) {
            cancelPreviewTimer();
            schedulePreviewAdvance();
          }
        };
        $("preview-speed").onchange = () => {
          simulation.speed = Number($("preview-speed").value);
          renderPreview();
        };
        $("preview-real-wait").onchange = () => {
          simulation.realWait = $("preview-real-wait").checked;
          renderPreview();
        };
        $("preview-vars").onchange = (event) => {
          const key = event.target.dataset.previewVariable;
          if (!key) return;
          const variable = simulation.document.variables.find(
            (item) => item.key === key,
          );
          const errors = [];
          checkValue(variable.type, event.target.value, variable.title, errors);
          if (errors.length) {
            message(errors[0], true);
            renderPreviewVariables();
            return;
          }
          rememberPreview();
          simulation.values[key] = parseValue(
            variable.type,
            event.target.value,
          );
          recordPreview(
            "手动调整 " + variable.title + " = " + previewVariableText(key),
          );
          renderPreviewVariables();
        };
        visitPreview(doc.entry);
        $("preview-text").focus({ preventScroll: true });
      }
      function parseValue(type, value) {
        return type === "Boolean"
          ? value === "true"
          : type === "Float"
            ? Math.fround(Number(value))
            : type === "Integer"
              ? Number(value)
              : value;
      }
      function substitute(text) {
        return String(text).replace(/\{\$(\w+)\}/g, (all, key) =>
          Object.hasOwn(simulation.values, key)
            ? previewVariableText(key)
            : all,
        );
      }
      function previewVariableText(key) {
        const value = simulation.values[key];
        const type = simulation.document.variables.find(
          (variable) => variable.key === key,
        ).type;
        if (type === "Boolean") return value ? "True" : "False";
        if (type === "Float" && Number.isFinite(value))
          return String(Number(value.toPrecision(7)));
        return String(value);
      }
      function recordPreview(text) {
        simulation.log.push(text);
        if (simulation.log.length > previewHistoryLimit) simulation.log.shift();
        $("preview-log").textContent = simulation.log.join("\n");
        $("preview-log").scrollTop = $("preview-log").scrollHeight;
      }
      function rememberPreview() {
        const state = simulation;
        state.history.push(
          clone({
            node: state.node,
            values: state.values,
            log: state.log,
            view: state.view,
            next: state.next,
            ended: state.ended,
            sequence: state.sequence,
            chain: state.chain,
          }),
        );
        if (state.history.length > previewHistoryLimit) state.history.shift();
        $("preview-back").disabled = false;
      }
      function movePreview(target) {
        if (simulation.typing) {
          completePreviewText();
          return;
        }
        if (!target) return;
        rememberPreview();
        visitPreview(target);
      }
      function visitPreview(id) {
        cancelPreviewTimer();
        const state = simulation;
        const node = state.document.nodes.find((item) => item.id === id);
        if (!node) throw new Error("试读卡片不存在 " + id);
        state.node = id;
        state.sequence++;
        state.next = node.next || null;
        state.ended = node.type === "end";
        state.view = {
          type: node.type,
          title: node.title,
          actor: "",
          text: "",
          options: [],
          seconds: node.seconds || 0,
        };
        if (
          ["say", "choice", "end"].includes(node.type) ||
          (node.type === "wait" && state.realWait && node.seconds > 0)
        )
          state.chain = [];
        else {
          const signature = id + ":" + JSON.stringify(state.values);
          if (
            state.chain.includes(signature) ||
            state.chain.length >= previewStepBudget
          ) {
            const repeated = state.chain.includes(signature);
            state.auto = false;
            state.next = id;
            state.chain = [];
            state.view.type = "checkpoint";
            state.view.text = repeated
              ? "卡片和变量状态重复，试读已暂停。可调整变量后继续检查。"
              : "已连续执行 200 步，试读已暂停。点击继续可检查后续剧情。";
            recordPreview("暂停检查 · " + node.title);
            renderPreview();
            return;
          }
          state.chain.push(signature);
        }
        if (node.type === "say") {
          state.view.actor =
            catalog.actors.find((actor) => actor.id === node.actor)?.title ||
            "旁白";
          state.view.text = substitute(node.text);
          recordPreview("对白 · " + node.title);
        } else if (node.type === "choice") {
          state.next = null;
          state.view.text = "请选择接下来的行动";
          state.view.options = node.options.map((option) => ({
            text: substitute(option.text),
            target: option.target,
          }));
          recordPreview("等待选择 · " + node.title);
        } else if (node.type === "set") {
          const variable = state.document.variables.find(
            (item) => item.key === node.variable,
          );
          const value = parseValue(
            variable.type,
            variable.type === "String" ? substitute(node.value) : node.value,
          );
          state.values[node.variable] =
            node.operation === "add"
              ? state.values[node.variable] + value
              : node.operation === "subtract"
                ? state.values[node.variable] - value
                : value;
          if (variable.type === "Integer") state.values[node.variable] |= 0;
          if (variable.type === "Float")
            state.values[node.variable] = Math.fround(
              state.values[node.variable],
            );
          state.view.text =
            variable.title + " = " + previewVariableText(variable.key);
          recordPreview("修改变量 · " + state.view.text);
        } else if (node.type === "condition") {
          const variable = state.document.variables.find(
            (item) => item.key === node.variable,
          );
          const left = state.values[node.variable],
            right = parseValue(
              variable.type,
              variable.type === "String" ? substitute(node.value) : node.value,
            );
          const pass = {
            eq: () => left === right,
            neq: () => left !== right,
            gt: () => left > right,
            gte: () => left >= right,
            lt: () => left < right,
            lte: () => left <= right,
          }[node.comparison || "eq"]();
          state.next = pass ? node.onTrue : node.onFalse;
          state.view.text =
            node.title + "：" + (pass ? "满足条件" : "不满足条件");
          recordPreview("条件分支 · " + state.view.text);
        } else if (node.type === "wait") {
          state.view.text = "等待 " + node.seconds + " 秒";
          recordPreview("等待 · " + node.seconds + " 秒");
        } else if (node.type === "event") {
          state.view.text =
            "模拟事件：" +
            (node.eventTitle || node.eventId) +
            "\n参数：" +
            (node.value || "无");
          recordPreview(state.view.text.replace("\n", " · "));
        } else if (node.type === "sound") {
          state.view.text =
            "模拟音效：" +
            (catalog.audio.find((item) => item.id === node.audio)?.title ||
              node.audio);
          recordPreview(state.view.text);
        } else {
          state.auto = false;
          state.next = null;
          state.view.text = "这段剧情已结束";
          recordPreview("剧情结束");
        }
        renderPreview();
      }
      function renderPreviewVariables() {
        $("preview-vars").innerHTML =
          simulation.document.variables
            .map(
              (variable) =>
                `<div class="preview-variable"><label>${esc(variable.title)}</label>${valueEditor(variable.type, String(simulation.values[variable.key]), `data-preview-variable="${esc(variable.key)}" aria-label="试读变量 ${esc(variable.title)}"`)}</div>`,
            )
            .join("") || '<p class="hint">本段没有剧情变量</p>';
        $("preview-log").textContent = simulation.log.join("\n");
      }
      function renderPreview() {
        cancelPreviewTimer();
        const state = simulation;
        $("preview-progress").textContent =
          "第 " + state.sequence + " 步 · " + state.view.title;
        $("preview-actor").textContent = state.view.actor;
        $("preview-actions").innerHTML = "";
        $("preview-text").textContent = state.view.text;
        $("preview-back").disabled = !state.history.length;
        $("preview-auto").textContent = state.auto
          ? "Ⅱ 暂停自动"
          : "▶ 自动播放";
        $("preview-auto").disabled =
          state.ended || (!state.next && !state.view.options.length);
        state.typing = state.view.type === "say" && state.speed > 0;
        for (const option of state.view.options)
          previewButton(option.text, () => {
            rememberPreview();
            recordPreview("玩家选择 · " + option.text);
            visitPreview(option.target);
          });
        if (state.next)
          previewButton(
            state.typing
              ? "补全文字 / 空格"
              : state.view.type === "wait"
                ? "跳过等待 →"
                : "继续 →",
            () => movePreview(state.next),
          );
        renderPreviewVariables();
        if (state.typing) {
          const characters = Array.from(state.view.text),
            started = performance.now();
          const tick = () => {
            const length = Math.min(
              characters.length,
              Math.floor(((performance.now() - started) * state.speed) / 1000),
            );
            $("preview-text").textContent = characters
              .slice(0, length)
              .join("");
            if (length === characters.length) completePreviewText();
            else schedulePreview(tick, 33);
          };
          $("preview-text").textContent = "";
          schedulePreview(tick, 33);
        } else schedulePreviewAdvance();
      }
      function completePreviewText() {
        cancelPreviewTimer();
        simulation.typing = false;
        $("preview-text").textContent = simulation.view.text;
        const button = $("preview-actions").querySelector("button");
        if (button) button.textContent = "继续 →";
        schedulePreviewAdvance();
      }
      function schedulePreviewAdvance() {
        const state = simulation;
        if (!state.next || state.ended) return;
        if (state.view.type === "wait" && state.realWait)
          schedulePreview(
            () => movePreview(state.next),
            state.view.seconds * 1000,
          );
        else if (state.auto)
          schedulePreview(
            () => movePreview(state.next),
            state.view.type === "say" ? 1000 : 450,
          );
      }
      function previewButton(text, action) {
        const button = document.createElement("button");
        button.textContent = text;
        button.onclick = action;
        $("preview-actions").appendChild(button);
      }
      $("modal").addEventListener("close", stopPreview);
      $("modal").addEventListener("keydown", (event) => {
        if (
          simulation &&
          !editingText(event.target) &&
          !event.target.closest("button") &&
          [" ", "Enter"].includes(event.key)
        ) {
          event.preventDefault();
          movePreview(simulation.next);
        }
      });
      $("preview").onclick = startPreview;

      async function boot() {
        try {
          loadUiPreferences();
          const raw = localStorage.getItem(draftKey);
          if (raw) {
            const saved = JSON.parse(raw);
            if (saved.doc?.version === 1 && Array.isArray(saved.doc.nodes)) {
              doc = saved.doc;
              revision = saved.revision || "";
              selected = saved.selected || doc.entry;
              dirty = saved.dirty !== false;
            }
          }
          const libraryRaw = localStorage.getItem(libraryKey);
          if (libraryRaw) {
            const savedLibrary = JSON.parse(libraryRaw);
            if (!Array.isArray(savedLibrary.items))
              throw new Error("本地剧情列表格式错误");
            storyLibrary = savedLibrary;
            const active = storyLibrary.items.find(
              (item) => item.slot === storyLibrary.active,
            );
            if (!Array.isArray(active?.doc?.nodes))
              throw new Error("本地剧情列表缺少当前剧情");
            doc = active.doc;
            revision = active.revision || "";
            selected = active.selected || doc.entry;
            dirty = active.dirty !== false;
          }
          const activeState = libraryRaw
            ? storyLibrary.items.find(
                (item) => item.slot === storyLibrary.active,
              )
            : { doc, revision, dirty };
          for (const item of [
            activeState,
            ...storyLibrary.items,
            ...(storyLibrary.trash || []),
          ]) {
            if (/^[A-Za-z][A-Za-z0-9_]{0,63}$/.test(item.doc.id)) continue;
            const previousId = item.doc.id;
            item.doc.id = "story_" + crypto.randomUUID().replaceAll("-", "");
            if (!item.doc.title || item.doc.title === "新的剧情")
              item.doc.title = previousId || "新的剧情";
            item.revision = "";
            item.dirty = true;
          }
          revision = activeState.revision;
          dirty = activeState.dirty;
          for (const item of storyLibrary.items)
            if (item.revision)
              knownRevisions.set(
                revisionKey(item.doc.id, item.slot),
                item.revision,
              );
          saveDraft();
          if (revision) knownRevisions.set(revisionKey(doc.id), revision);
        } catch (error) {
          message("本地草稿读取失败：" + error.message, true);
        }
        render();
        if (token) {
          try {
            await refreshCatalog(false);
            message("Unity 已连接 · 草稿自动保存，可直接回填");
          } catch (error) {
            message("Unity 连接失败：" + error.message, true);
          }
        } else {
          $("status").textContent =
            "离线编辑可导出 JSON · 一键回填请从 Unity 菜单打开";
        }
        $("sync-state").textContent = dirty
          ? "草稿已自动保存 · 待回填"
          : "与 Unity 回填版本一致";
        selectNode(selected, true, false);
      }
      window.addEventListener("resize", refreshLayout);
      boot();
    </script>
  </body>
</html>
